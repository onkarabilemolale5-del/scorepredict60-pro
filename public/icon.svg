<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="bullGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bearRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1f2937" stroke-width="4"/>

  <!-- Subtle grid lines -->
  <line x1="64" y1="128" x2="448" y2="128" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="64" y1="384" x2="448" y2="384" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Candlestick 1 (Bearish pullback) -->
  <line x1="140" y1="160" x2="140" y2="360" stroke="#f43f5e" stroke-width="4"/>
  <rect x="122" y="200" width="36" height="110" rx="4" fill="url(#bearRed)"/>

  <!-- Candlestick 2 (Liquidity sweep & wick) -->
  <line x1="220" y1="180" x2="220" y2="410" stroke="#f43f5e" stroke-width="4"/>
  <rect x="202" y="240" width="36" height="90" rx="4" fill="url(#bearRed)"/>

  <!-- Candlestick 3 (Order Block rejection / MSS shift) -->
  <line x1="300" y1="140" x2="300" y2="370" stroke="#10b981" stroke-width="4"/>
  <rect x="282" y="190" width="36" height="130" rx="4" fill="url(#bullGreen)" filter="url(#glow)"/>

  <!-- Candlestick 4 (Breakout Entry Trigger) -->
  <line x1="380" y1="90" x2="380" y2="300" stroke="#10b981" stroke-width="4"/>
  <rect x="362" y="120" width="36" height="150" rx="4" fill="url(#bullGreen)" filter="url(#glow)"/>

  <!-- Trigger Indicator Dot & Pulse -->
  <circle cx="380" cy="120" r="14" fill="#34d399"/>
  <circle cx="380" cy="120" r="24" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6"/>

  <!-- Target Crosshair on POI -->
  <line x1="260" y1="240" x2="420" y2="240" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
  <rect x="270" y="228" width="58" height="24" rx="4" fill="#0284c7" opacity="0.9"/>
  <text x="299" y="245" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MSS ✓</text>
</svg>
